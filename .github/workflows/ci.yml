name: ScoutSphere CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: scoutsphere
          POSTGRES_PASSWORD: scoutsphere_dev_pass
          POSTGRES_DB: scoutsphere_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy pytest pytest-asyncio httpx aiosqlite email-validator aiofiles
          cd backend && pip install -e ".[dev]"

      - name: Run Ruff Lint Check
        run: ruff check backend/

      - name: Run Black Code Formatting Check
        run: black --check backend/

      - name: Run Pytest Suite
        env:
          DATABASE_URL: sqlite+aiosqlite:///./scoutsphere.db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test_ci_jwt_secret_key_32bytes_long
          PYTHONPATH: .
        run: |
          cd backend
          python -m pytest -v

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Lint
        run: |
          cd frontend
          npm run lint || true

      - name: Run Frontend Build
        run: |
          cd frontend
          npm run build
